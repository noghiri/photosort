[workspace]
resolver = "3"
members = ["crates/photosort-core", "crates/photosort", "crates/photosort-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/noghiri/photosort"
publish = false

[workspace.dependencies]
photosort-core = { path = "crates/photosort-core" }
photosort-testkit = { path = "crates/photosort-testkit" }
eframe = "=0.37.0"
blake3 = "=1.8.7"
thiserror = "=2.0.21"
proptest = "=1.12.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
quick_cache = "=0.7.0"
rfd = "=0.17.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[workspace.lints.clippy]
# House style: `push_str(&format!(..))` allocates needlessly; use `write!`.
format_push_string = "warn"
